name: Fix concept stage asset loading

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-concept-stage-data.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix stage data attribute lookup
        shell: python
        run: |
          from pathlib import Path
          path = Path('concept-evolution.js')
          text = path.read_text(encoding='utf-8')
          old = "const stageUrls=[conceptRoot.dataset.stage0,conceptRoot.dataset.stage1,conceptRoot.dataset.stage2].filter(Boolean);"
          new = "const stageUrls=[conceptRoot.getAttribute('data-stage-0'),conceptRoot.getAttribute('data-stage-1'),conceptRoot.getAttribute('data-stage-2')].filter(Boolean);"
          if old not in text:
              raise SystemExit('Expected stage URL lookup not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          grep -q "getAttribute('data-stage-0')" concept-evolution.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add concept-evolution.js
          git commit -m 'fix: load local concept stage textures [skip ci]'
          git push origin HEAD:main
