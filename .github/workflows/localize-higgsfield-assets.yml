name: Localize Higgsfield assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/localize-higgsfield-assets.yml'

permissions:
  contents: write

jobs:
  localize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Higgsfield assets into repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          curl -L --fail --retry 3 --retry-delay 2 -o assets/concept-traccia.png 'https://d8j0ntlcm91z4.cloudfront.net/user_3JN4lq7KBj4c3qEQUgSkbrftgrd/hf_20260916_135109_ad7525fd-aa0f-4d21-9c7e-1a42ad3a7f42.png'
          curl -L --fail --retry 3 --retry-delay 2 -o assets/concept-stencil.png 'https://d8j0ntlcm91z4.cloudfront.net/user_3JN4lq7KBj4c3qEQUgSkbrftgrd/hf_20260916_135151_5f754f1c-9fe1-4e3f-a9a3-02312b377c9e.png'
          curl -L --fail --retry 3 --retry-delay 2 -o assets/concept-inchiostro.png 'https://d8j0ntlcm91z4.cloudfront.net/user_3JN4lq7KBj4c3qEQUgSkbrftgrd/hf_20260916_135223_01bfa4e6-8847-4dcf-99b2-01d0f63a4904.png'
          curl -L --fail --retry 3 --retry-delay 2 -o assets/configurator-sacro.png 'https://d8j0ntlcm91z4.cloudfront.net/user_3JN4lq7KBj4c3qEQUgSkbrftgrd/hf_20260916_135551_a81d89f9-462a-4f62-b290-d9c8da92dcfa.png'
          curl -L --fail --retry 3 --retry-delay 2 -o assets/configurator-ornamentale.png 'https://d8j0ntlcm91z4.cloudfront.net/user_3JN4lq7KBj4c3qEQUgSkbrftgrd/hf_20260916_135551_cdbb0b95-212f-4e1b-92b6-f513d3789b9e.png'
          curl -L --fail --retry 3 --retry-delay 2 -o assets/referral-motion.mp4 'https://d8j0ntlcm91z4.cloudfront.net/user_3JN4lq7KBj4c3qEQUgSkbrftgrd/hf_20260915_234704_aa92ccb0-d8c9-4445-b002-0962c9e540d0.mp4'
          test -s assets/concept-traccia.png
          test -s assets/concept-stencil.png
          test -s assets/concept-inchiostro.png
          test -s assets/configurator-sacro.png
          test -s assets/configurator-ornamentale.png
          test -s assets/referral-motion.mp4

      - name: Replace CDN references with local assets
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              'https://d8j0ntlcm91z4.cloudfront.net/user_3JN4lq7KBj4c3qEQUgSkbrftgrd/hf_20260916_135109_ad7525fd-aa0f-4d21-9c7e-1a42ad3a7f42.png': 'assets/concept-traccia.png',
              'https://d8j0ntlcm91z4.cloudfront.net/user_3JN4lq7KBj4c3qEQUgSkbrftgrd/hf_20260916_135151_5f754f1c-9fe1-4e3f-a9a3-02312b377c9e.png': 'assets/concept-stencil.png',
              'https://d8j0ntlcm91z4.cloudfront.net/user_3JN4lq7KBj4c3qEQUgSkbrftgrd/hf_20260916_135223_01bfa4e6-8847-4dcf-99b2-01d0f63a4904.png': 'assets/concept-inchiostro.png',
              'https://d8j0ntlcm91z4.cloudfront.net/user_3JN4lq7KBj4c3qEQUgSkbrftgrd/hf_20260916_135551_a81d89f9-462a-4f62-b290-d9c8da92dcfa.png': 'assets/configurator-sacro.png',
              'https://d8j0ntlcm91z4.cloudfront.net/user_3JN4lq7KBj4c3qEQUgSkbrftgrd/hf_20260916_135551_cdbb0b95-212f-4e1b-92b6-f513d3789b9e.png': 'assets/configurator-ornamentale.png',
              'https://d8j0ntlcm91z4.cloudfront.net/user_3JN4lq7KBj4c3qEQUgSkbrftgrd/hf_20260915_234704_aa92ccb0-d8c9-4445-b002-0962c9e540d0.mp4': 'assets/referral-motion.mp4',
              "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js": './assets/three.module.js',
          }

          for filename in ['index.html', 'configuratore.html', 'configuratore.js', 'concept-evolution.js', 'app.js']:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')

      - name: Verify there are no remaining runtime CDN references
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn 'd8j0ntlcm91z4.cloudfront.net' --include='*.html' --include='*.js' --include='*.css' .; then
            echo 'Found remaining Higgsfield CDN reference.' >&2
            exit 1
          fi
          if grep -n 'cdn.jsdelivr.net/npm/three' configuratore.js concept-evolution.js; then
            echo 'Found remaining Three.js CDN dependency.' >&2
            exit 1
          fi
          grep -q "./assets/three.module.js" configuratore.js
          grep -q "./assets/three.module.js" concept-evolution.js
          grep -q "assets/concept-inchiostro.png" configuratore.html
          grep -q "assets/configurator-sacro.png" configuratore.html
          grep -q "assets/configurator-ornamentale.png" configuratore.html
          grep -q "assets/referral-motion.mp4" app.js

      - name: Commit localized assets and references
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/concept-traccia.png assets/concept-stencil.png assets/concept-inchiostro.png assets/configurator-sacro.png assets/configurator-ornamentale.png assets/referral-motion.mp4 index.html configuratore.html configuratore.js concept-evolution.js app.js
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'chore: serve Higgsfield media locally [skip ci]'
          git push origin HEAD:main
