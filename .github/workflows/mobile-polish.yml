name: Mobile-first polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Optimize assets and mobile UX
        shell: bash
        run: |
          python -m pip install --quiet pillow
          python <<'PY'
          from pathlib import Path
          from PIL import Image
          import re

          css = r''':root{--mobile-hit:44px}
          @media(max-width:720px){
            html{scroll-padding-top:calc(28px + env(safe-area-inset-top));-webkit-text-size-adjust:100%;text-size-adjust:100%}
            body{overflow-x:clip;overscroll-behavior-y:auto}
            body.nav-open{overflow:hidden;touch-action:none}
            .demo-bar,.cfg-demo-bar{padding-top:calc(9px + env(safe-area-inset-top));padding-left:max(5%,env(safe-area-inset-left));padding-right:max(5%,env(safe-area-inset-right))}
            header,.cfg-header{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
            section[id]{scroll-margin-top:calc(24px + env(safe-area-inset-top))}
            .menu-toggle{min-width:88px;min-height:var(--mobile-hit);align-items:center;justify-content:center;padding:10px 14px}
            nav.open{z-index:100;max-height:calc(100dvh - 110px - env(safe-area-inset-bottom));overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;box-shadow:0 18px 44px #24251f1f}
            nav.open a{display:flex;align-items:center;min-height:48px;padding:12px 4px}
            nav.open .nav-cta{padding:12px 16px}
            .scene-tools button,.stages button,.concept-stage-nav button,.referral-stage{min-height:48px}
            .play-scene,.concept-play{min-height:44px;display:inline-flex;align-items:center;padding:10px 0}
            .hero-bottom a,.text-link,.social,footer a{min-height:44px;display:inline-flex;align-items:center}
            .hero-bottom a{padding:8px 0}
            .contact-details .text-link{padding:8px 0}
            .social{padding:12px 0;margin-top:18px}
            footer>div:last-child>a,footer p a{padding:10px 0}
            .concept-stage-nav{gap:0}
            .concept-stage-nav button{padding:14px 4px;grid-template-columns:34px 1fr auto}
            .concept-play{font-size:11px}
            .concept-visual-shell{min-height:clamp(370px,104vw,470px);margin-top:20px}
            .concept-3d-host,.sculpture,.cfg-canvas-host{touch-action:pan-y}
            .concept-visual-meta{font-size:8px;line-height:1.35}
            .referral-stage{padding-top:10px;padding-bottom:10px}
            .referral-share button{min-height:44px}
            .share-status{min-height:28px;font-size:11px;line-height:1.5;margin-top:8px}
            .configurator-teaser .button{min-height:52px;width:100%;max-width:360px}
            .cfg-header{align-items:center;gap:14px;padding-top:18px;padding-bottom:18px}
            .cfg-brand{min-height:44px;display:flex;flex-direction:column;justify-content:center}
            .cfg-back{min-height:44px;display:flex;align-items:center;padding:8px 0;line-height:1.3}
            .cfg-shell{padding-left:max(5%,env(safe-area-inset-left));padding-right:max(5%,env(safe-area-inset-right));padding-bottom:calc(40px + env(safe-area-inset-bottom))}
            .cfg-intro h1{font-size:clamp(44px,13vw,55px);line-height:.98;letter-spacing:-2.8px}
            .cfg-intro>p{font-size:13px;line-height:1.7}
            .cfg-progress-nav{scroll-snap-type:x proximity;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
            .cfg-progress-nav button{min-width:108px;min-height:58px;scroll-snap-align:start;padding:12px}
            .cfg-viewer{min-height:clamp(390px,58svh,500px)}
            @supports(height:1dvh){.cfg-viewer{min-height:clamp(390px,58dvh,500px)}}
            .cfg-viewer-toolbar{top:12px;left:10px;right:10px;gap:8px}
            .cfg-viewer-label{font-size:8px;line-height:1.3;padding:9px 10px;max-width:55%;backdrop-filter:none}
            .cfg-view-actions{gap:6px}
            .cfg-view-actions button{width:48px;height:48px;min-width:48px;min-height:48px}
            .cfg-viewer-meta{bottom:10px;left:10px;right:10px;font-size:8px;line-height:1.35}
            .cfg-step{padding:24px 18px}
            .cfg-step>p{font-size:12px;line-height:1.65}
            .cfg-choice{min-height:76px;padding:14px}
            .cfg-choice strong{font-size:12px}
            .cfg-choice small{font-size:10px;line-height:1.45}
            .cfg-design{min-height:44px}
            .cfg-design span{font-size:10px;padding:9px 4px 5px}
            .cfg-upload{padding:10px 14px}
            .cfg-upload label{min-height:48px;font-size:11px;line-height:1.35}
            .cfg-slider{grid-template-columns:74px minmax(0,1fr) 42px;gap:10px;margin:8px 0;min-height:52px}
            .cfg-slider label{font-size:11px;line-height:1.3}
            .cfg-slider output{font-size:10px}
            .cfg-slider input[type=range]{-webkit-appearance:none;appearance:none;height:44px;background:transparent;padding:0;margin:0;accent-color:var(--cfg-red)}
            .cfg-slider input[type=range]::-webkit-slider-runnable-track{height:4px;background:#bdb5a8;border-radius:99px}
            .cfg-slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--cfg-red);background:var(--cfg-paper);margin-top:-12px;box-shadow:0 0 0 4px #ad372514}
            .cfg-slider input[type=range]::-moz-range-track{height:4px;background:#bdb5a8;border:0;border-radius:99px}
            .cfg-slider input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;border:1px solid var(--cfg-red);background:var(--cfg-paper);box-shadow:0 0 0 4px #ad372514}
            .cfg-tone{width:48px;height:48px;min-width:48px;min-height:48px}
            .cfg-tone-row{gap:10px}
            .cfg-idea{font-size:16px;line-height:1.5;min-height:104px}
            .cfg-code{min-height:62px}
            .cfg-code button{min-width:56px;min-height:44px;padding:10px 8px}
            #copy-status{font-size:11px!important;min-height:24px!important;line-height:1.5}
            .cfg-primary{min-height:54px;font-size:12px}
            .cfg-disclaimer{padding-bottom:calc(18px + env(safe-area-inset-bottom));font-size:10px;line-height:1.7}
            .button,.menu-toggle,.scene-tools button,.concept-play,.play-scene,.referral-stage,.referral-share button,.cfg-choice,.cfg-design,.cfg-view-actions button,.cfg-tone,.cfg-code button,.cfg-primary{touch-action:manipulation}
            .button:active,.menu-toggle:active,.scene-tools button:active,.concept-play:active,.play-scene:active,.referral-stage:active,.referral-share button:active,.cfg-choice:active,.cfg-design:active,.cfg-view-actions button:active,.cfg-tone:active,.cfg-code button:active,.cfg-primary:active{opacity:.72}
          }
          @media(max-width:360px){
            h1{font-size:clamp(54px,18vw,62px)}
            .hero-top>span:last-child{display:none}
            .stage-panel{gap:6px}
            .stages{gap:4px;flex-wrap:wrap}
            .stages button{padding:8px 6px}
            .concept-stage-nav button{grid-template-columns:30px 1fr auto;gap:8px}
            .concept-stage-nav button>span:last-child{font-size:8px}
            .concept-visual-meta span:first-child{display:none}
            .cfg-header{align-items:flex-start}
            .cfg-brand{font-size:25px}
            .cfg-back{max-width:132px;font-size:9px;text-align:right;justify-content:flex-end}
            .cfg-viewer{min-height:370px}
            .cfg-viewer-label{max-width:50%}
            .cfg-view-actions button{width:46px;height:46px;min-width:46px;min-height:46px}
            .cfg-slider{grid-template-columns:68px minmax(0,1fr) 38px;gap:8px}
          }
          @media(max-width:720px) and (orientation:landscape) and (max-height:600px){
            nav.open{max-height:calc(100dvh - 88px);padding:12px 20px}
            nav.open a{min-height:44px;padding:8px 4px}
            .cfg-viewer{min-height:78svh}
            .cfg-intro{padding-top:18px}
          }
          @media(hover:none) and (pointer:coarse){
            .button:hover,.concept-card:hover,.cfg-choice:hover,.cfg-design:hover,.cfg-primary:hover,.scene-tools button:hover,.cfg-view-actions button:hover{transform:none}
            .configurator-preview:hover .configurator-preview-card{transform:rotateY(-15deg) rotateX(5deg)}
          }
          @media(prefers-reduced-motion:reduce){
            .button:active,.menu-toggle:active,.scene-tools button:active,.concept-play:active,.play-scene:active,.referral-stage:active,.referral-share button:active,.cfg-choice:active,.cfg-design:active,.cfg-view-actions button:active,.cfg-tone:active,.cfg-code button:active,.cfg-primary:active{transform:none}
          }
          '''
          Path('mobile.css').write_text(css, encoding='utf-8')

          for name, marker in [('index.html','<link rel="stylesheet" href="concept-evolution.css">'),('configuratore.html','<link rel="stylesheet" href="configuratore.css">')]:
              p=Path(name); s=p.read_text(encoding='utf-8')
              if 'href="mobile.css"' not in s:
                  s=s.replace(marker, marker+'\n  <link rel="stylesheet" href="mobile.css">',1)
              p.write_text(s,encoding='utf-8')

          assets=['concept-traccia','concept-stencil','concept-inchiostro','configurator-sacro','configurator-ornamentale']
          for stem in assets:
              src=Path('assets')/(stem+'.png')
              dst=Path('assets')/(stem+'.webp')
              if src.exists():
                  im=Image.open(src).convert('RGB')
                  im.save(dst,'WEBP',quality=88,method=6)

          replacements={f'assets/{x}.png':f'assets/{x}.webp' for x in assets}
          for p in list(Path('.').rglob('*.html'))+list(Path('.').rglob('*.js'))+list(Path('.').rglob('*.css')):
              s=p.read_text(encoding='utf-8')
              old=s
              for a,b in replacements.items(): s=s.replace(a,b)
              if s!=old: p.write_text(s,encoding='utf-8')
          for stem in assets:
              src=Path('assets')/(stem+'.png')
              if src.exists(): src.unlink()

          p=Path('configuratore.js'); s=p.read_text(encoding='utf-8')
          s=s.replace("const clock=new THREE.Clock();const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;\n        function animate(){requestAnimationFrame(animate);if(!visible)return;const dt=Math.min(.04,clock.getDelta());limbGroup.rotation.y+=(targetRotY-limbGroup.rotation.y)*Math.min(1,dt*7);limbGroup.rotation.x+=(targetRotX-limbGroup.rotation.x)*Math.min(1,dt*7);if(!dragging&&!reduced)targetRotY+=Math.sin(performance.now()*.00027)*.00018;renderer.render(scene,camera)}",
          "const clock=new THREE.Clock();const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;const coarse=matchMedia('(pointer: coarse)').matches;let lastMobileRender=0;\n        function animate(time=performance.now()){requestAnimationFrame(animate);if(!visible||document.hidden)return;if(coarse&&time-lastMobileRender<33)return;lastMobileRender=time;const dt=Math.min(.04,clock.getDelta());limbGroup.rotation.y+=(targetRotY-limbGroup.rotation.y)*Math.min(1,dt*7);limbGroup.rotation.x+=(targetRotX-limbGroup.rotation.x)*Math.min(1,dt*7);if(!dragging&&!reduced&&!coarse)targetRotY+=Math.sin(performance.now()*.00027)*.00018;renderer.render(scene,camera)}")
          p.write_text(s,encoding='utf-8')

          p=Path('concept-evolution.js'); s=p.read_text(encoding='utf-8')
          s=s.replace("const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;","const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n        const coarse=window.matchMedia('(pointer: coarse)').matches;\n        let lastMobileRender=0;")
          s=s.replace("function animate(){\n          requestAnimationFrame(animate);\n          if(!visible)return;\n          const dt=Math.min(.04,clock.getDelta());","function animate(time=performance.now()){\n          requestAnimationFrame(animate);\n          if(!visible||document.hidden)return;\n          if(coarse&&time-lastMobileRender<33)return;\n          lastMobileRender=time;\n          const dt=Math.min(.04,clock.getDelta());")
          s=s.replace("if(!dragging&&!reduced)group.rotation.y+=Math.sin(performance.now()*.00035)*.00016;","if(!dragging&&!reduced&&!coarse)group.rotation.y+=Math.sin(performance.now()*.00035)*.00016;")
          p.write_text(s,encoding='utf-8')

          # Safety checks
          for name in ['index.html','configuratore.html','configuratore.js','concept-evolution.js','app.js']:
              txt=Path(name).read_text(encoding='utf-8')
              if 'd8j0ntlcm91z4.cloudfront.net' in txt or 'cdn.jsdelivr.net' in txt:
                  raise SystemExit(f'Forbidden runtime CDN reference remains in {name}')
          if "coarse=matchMedia('(pointer: coarse)').matches" not in Path('configuratore.js').read_text(encoding='utf-8'):
              raise SystemExit('Configurator performance patch did not apply')
          if "coarse=window.matchMedia('(pointer: coarse)').matches" not in Path('concept-evolution.js').read_text(encoding='utf-8'):
              raise SystemExit('Concept performance patch did not apply')
          PY
          git status --short
      - name: Commit mobile polish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Optimize mobile UX, touch targets and assets [skip ci]"
            git push origin HEAD:main
          fi